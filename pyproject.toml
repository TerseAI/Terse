[tool.uv.workspace]
members = [
    "packages/terse-python-sdk",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "bump-my-version>=1.2.7",
    "datamodel-code-generator>=0.26",
    "pytest>=8.4.2",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["packages/terse-python-sdk/src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "packages/terse-python-sdk/tests",
]
