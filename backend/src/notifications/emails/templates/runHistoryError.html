<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Terse Run Error</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background: #fafafa;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                    sans-serif;
                color: #111827;
            }

            .wrapper {
                width: 100%;
                padding: 24px 12px;
            }

            .card {
                width: 100%;
                max-width: 620px;
                margin: 0 auto;
                background: #ffffff;
                border: 1px solid #e4e4e7;
                border-radius: 14px;
                overflow: hidden;
            }

            .header {
                padding: 20px 24px;
                border-bottom: 1px solid #e4e4e7;
                background: #f4f4f5;
                text-align: left;
            }

            .brand {
                margin: 0 0 12px;
                line-height: 1;
                text-align: left;
            }

            .logo {
                width: 45px;
                height: 45px;
                display: block;
                margin: 0;
            }

            .title {
                margin: 0;
                font-size: 24px;
                line-height: 1.2;
                font-weight: 650;
                color: #111827;
            }

            .subtitle {
                margin: 8px 0 0;
                font-size: 14px;
                line-height: 1.4;
                color: #6b7280;
            }

            .content {
                padding: 20px 24px 24px;
            }

            .meta {
                margin: 0;
            }

            .meta + .meta {
                margin-top: 14px;
            }

            .meta + .error-block {
                margin-top: 14px;
            }

            .meta + .button {
                margin-top: 14px;
            }

            .label {
                margin: 0 0 6px;
                font-size: 11px;
                line-height: 1;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: #6b7280;
            }

            .value {
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                font-weight: 600;
                color: #111827;
            }

            .error-block {
                margin: 0;
                padding: 12px 14px;
                border: 1px solid #fecaca;
                border-radius: 10px;
                background: #fff1f2;
            }

            .error-text {
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
                color: #7f1d1d;
                word-break: break-word;
            }

            .error-block + .button {
                margin-top: 14px;
            }

            .button {
                display: inline-block;
                padding: 10px 14px;
                border-radius: 8px;
                background: #111827;
                color: #ffffff !important;
                text-decoration: none;
                font-size: 13px;
                font-weight: 600;
            }

            @media (max-width: 600px) {
                .wrapper {
                    padding: 14px 8px;
                }

                .header,
                .content {
                    padding: 16px;
                }

                .title {
                    font-size: 20px;
                }
            }
        </style>
    </head>
    <body>
        <table role="presentation" cellpadding="0" cellspacing="0" class="wrapper">
            <tr>
                <td align="center">
                    <table role="presentation" cellpadding="0" cellspacing="0" class="card">
                        <tr>
                            <td class="header">
                                <p class="brand">
                                    <img src="{{#if logoSrc}}{{logoSrc}}{{else}}https://app.useterse.ai/terse.png{{/if}}" width="45" height="45" alt="Terse" class="logo" style="display: block; margin: 0; width: 45px; height: 45px;" />
                                </p>
                                <h1 class="title">Run Failed</h1>
                                <p class="subtitle">This run ended with an error and needs attention.</p>
                            </td>
                        </tr>
                        <tr>
                            <td class="content">
                                <div class="meta">
                                    <p class="label">Agent</p>
                                    <p class="value">{{#if agent.name}}{{agent.name}}{{else}}Unknown agent{{/if}}</p>
                                </div>

                                <div class="meta">
                                    <p class="label">Notification For</p>
                                    <p class="value">A run failed.</p>
                                </div>

                                <div class="error-block">
                                    <p class="label" style="color: #7f1d1d; margin-bottom: 6px">Error</p>
                                    <p class="error-text">{{#if errorMessage}}{{errorMessage}}{{else}}No error details available.{{/if}}</p>
                                </div>

                                {{#if runUrl}}
                                <a href="{{runUrl}}" class="button">Open run history</a>
                                {{/if}}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
