<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weekly Agent Review</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background: #fafafa;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                    sans-serif;
                color: #111827;
            }

            .wrapper {
                width: 100%;
                padding: 24px 12px;
            }

            .card {
                width: 100%;
                max-width: 620px;
                margin: 0 auto;
                background: #ffffff;
                border: 1px solid #e4e4e7;
                border-radius: 14px;
                overflow: hidden;
            }

            .header {
                padding: 20px 24px;
                border-bottom: 1px solid #e4e4e7;
                background: #f4f4f5;
                text-align: left;
            }

            .logo {
                width: 45px;
                height: 45px;
                display: block;
                margin: 0;
            }

            .title {
                margin: 0;
                font-size: 24px;
                line-height: 1.2;
                font-weight: 650;
                color: #111827;
            }

            .subtitle {
                margin: 8px 0 0;
                font-size: 14px;
                line-height: 1.4;
                color: #6b7280;
            }

            .content {
                padding: 20px 24px 24px;
            }

            .agent-block {
                border: 1px solid #e4e4e7;
                border-radius: 10px;
                padding: 14px;
            }

            .agent-block + .agent-block {
                margin-top: 12px;
            }

            .agent-title {
                margin: 0;
                font-size: 15px;
                line-height: 1.45;
                font-weight: 600;
                color: #111827;
            }

            .agent-score {
                margin: 4px 0 10px;
                font-size: 13px;
                line-height: 1.45;
                color: #4b5563;
            }

            .improvements {
                margin: 0 0 12px;
                padding-left: 18px;
                color: #374151;
                font-size: 13px;
            }

            .improvement-item + .improvement-item {
                margin-top: 4px;
            }

            .empty-state {
                margin: 0;
                font-size: 14px;
                line-height: 1.5;
                color: #6b7280;
            }

            .button {
                display: inline-block;
                padding: 10px 14px;
                border-radius: 8px;
                background: #111827;
                color: #ffffff !important;
                text-decoration: none;
                font-size: 13px;
                font-weight: 600;
            }

            @media (max-width: 600px) {
                .wrapper {
                    padding: 14px 8px;
                }

                .header,
                .content {
                    padding: 16px;
                }

                .title {
                    font-size: 20px;
                }
            }
        </style>
    </head>
    <body>
        <table role="presentation" cellpadding="0" cellspacing="0" class="wrapper">
            <tr>
                <td align="center">
                    <table role="presentation" cellpadding="0" cellspacing="0" class="card">
                        <tr>
                            <td class="header">
                                <img src="{{#if logoSrc}}{{logoSrc}}{{else}}https://app.useterse.ai/terse.png{{/if}}" width="45" height="45" alt="Terse" class="logo" style="display: block; margin: 0 0 12px; width: 45px; height: 45px;" />
                                <h1 class="title">Weekly Agent Review</h1>
                                <p class="subtitle">A weekly summary of performance improvements for your active agents.</p>
                            </td>
                        </tr>
                        <tr>
                            <td class="content">
                                {{#each agents}}
                                <div class="agent-block">
                                    <p class="agent-title">{{name}}</p>
                                    <p class="agent-score">Overall score: {{overallScore}}/100</p>
                                    <ul class="improvements">
                                        {{#each improvements}}
                                        <li class="improvement-item">{{title}}</li>
                                        {{/each}}
                                    </ul>
                                    <a href="{{improvementsUrl}}" class="button">View Improvements</a>
                                </div>
                                {{else}}
                                <p class="empty-state">No new improvements this week.</p>
                                {{/each}}
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
