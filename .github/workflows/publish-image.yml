name: Publish Terse image

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: publish-image-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

env:
    REGISTRY: us-central1-docker.pkg.dev
    IMAGE: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/terse

jobs:
    publish:
        name: Build and push multi-arch image
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 45
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v3
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: linux/amd64,linux/arm64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,prefix=main-,enable={{is_default_branch}}
                      type=sha,prefix=sha-

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false
