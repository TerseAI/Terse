name: E2E Tests

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    e2e:
        name: End-to-End Tests
        runs-on: blacksmith-4vcpu-ubuntu-2404
        env:
            TERSE_BACKEND_URL: https://terse.onrender.com
            TERSE_FRONTEND_URL: https://terse-frontend.onrender.com

        steps:
            # ── Setup ─────────────────────────────────────────────────────────────

            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 9

            # ── Build CLI + SDK from PR source ────────────────────────────────────

            - name: Install dependencies
              run: pnpm install

            - name: Generate Prisma client
              working-directory: backend
              run: pnpm exec prisma generate

            - name: Build all packages
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: pnpm run build

            - name: Install CLI globally from PR source
              run: npm install -g ./packages/terse-cli

            - name: Verify CLI is available
              run: terse --version

            # ── E2E ───────────────────────────────────────────────────────────────
            # CLI talks to the staging backend at terse.onrender.com.
            # TERSE_API_KEY must be set as a GitHub Actions secret.

            - name: Write API key for CLI
              run: echo "TERSE_API_KEY=${{ secrets.TERSE_API_KEY }}" > packages/ci-test-fixture/.env

            - name: Place job file for TS fixture
              run: cp packages/ci-test-fixture/src/terse.jobs.src packages/ci-test-fixture/src/terse.jobs.ts

            - name: "[generate] Run codegen on CI test fixture"
              working-directory: packages/ci-test-fixture
              run: terse generate

            - name: "[assert] Verify project builds"
              working-directory: packages/ci-test-fixture
              run: pnpm typecheck

            - name: "[run] Execute CI test fixture"
              working-directory: packages/ci-test-fixture
              run: terse run "Tell me a joke" --event-file ./src/sample-webhook-event.json

            # ── E2E (Python) ────────────────────────────────────────────────────
            # Same test flow but exercising the Python SDK + CLI codegen.

            - name: Install uv
              uses: astral-sh/setup-uv@v6

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Python fixture dependencies
              working-directory: packages/ci-test-fixture-python
              run: uv sync

            - name: Write API key for Python fixture
              run: echo "TERSE_API_KEY=${{ secrets.TERSE_API_KEY }}" > packages/ci-test-fixture-python/.env

            - name: Place job file for Python fixture
              run: cp packages/ci-test-fixture-python/src/main.src packages/ci-test-fixture-python/src/main.py

            - name: "[generate] Run codegen on Python CI test fixture"
              working-directory: packages/ci-test-fixture-python
              run: terse generate

            - name: "[assert] Verify Python project type-checks"
              working-directory: packages/ci-test-fixture-python
              run: uv run ty check src/

            - name: "[run] Execute Python CI test fixture"
              working-directory: packages/ci-test-fixture-python
              run: terse run "Tell me a joke" --event-file ./src/sample-webhook-event.json

            # ── Cleanup ───────────────────────────────────────────────────────────

            - name: Upload logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-failure-logs
                  path: |
                      packages/ci-test-fixture/**/*.log
                      packages/ci-test-fixture-python/**/*.log
                  retention-days: 7
