name: E2E Tests

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    e2e:
        name: End-to-End Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: terse_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            # ── Setup ─────────────────────────────────────────────────────────────

            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 9

            # ── Build CLI + SDK from PR source ────────────────────────────────────

            - name: Install dependencies
              run: pnpm install

            - name: Build all packages
              run: pnpm run build

            - name: Install CLI globally from PR source
              run: pnpm run install-global

            - name: Install CLI globally from PR source
              run: npm install -g ./packages/terse-cli

            - name: Verify CLI is available
              run: terse --version

            # ── Backend ───────────────────────────────────────────────────────────

            - name: Run Prisma migrations
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/terse_test
              run: npx prisma migrate deploy

            - name: Start backend
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/terse_test
                  # 👇 add any other env vars your backend needs
              run: pnpm start & # & runs it in the background

            - name: Wait for backend to be ready
              run: npx wait-on http://localhost:3001/health # 👈 update port + health endpoint

            # ── E2E ───────────────────────────────────────────────────────────────
            # Sample project references the SDK via workspace:* so pnpm install
            # above already wired it up to the PR's SDK source.
            #
            - name: "[init] Scaffold in temp dir"
              run: |
                  mkdir /tmp/terse-init-test && cd /tmp/terse-init-test

            - name: "[generate] Run codegen on CI test fixture"
              working-directory: packages/ci-test-fixture
              run: terse generate

            - name: "[assert] Verify project builds"
              working-directory: packages/ci-test-fixture
              run: pnpm build

            - name: "[run] Execute CI test fixture"
              working-directory: packages/ci-test-fixture
              run: terse run "Tell me a joke" --event-file ./src/sample-webhook-event.json

            # ── Cleanup ───────────────────────────────────────────────────────────

            - name: Upload logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-failure-logs
                  path: |
                      /tmp/terse-init-test
                      packages/ci-test-fixture/**/*.log
                  retention-days: 7
