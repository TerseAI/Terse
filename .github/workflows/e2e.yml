name: E2E Tests

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    # ── Wait for Render PR preview ────────────────────────────────────────────
    # On pull_request events, Render spins up a preview of the backend service
    # at a URL like https://terse-pr-<N>.onrender.com. This job polls the
    # Render API until the preview's latest deploy reports status=live, then
    # exposes the preview URL to the e2e job. Skipped on push events (which
    # target the production URL instead).

    wait-for-render-preview:
        name: Wait for Render Preview
        # Skip on fork PRs — secrets aren't available, and a maintainer will re-run e2e
        # on a branch in this repo after review.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        runs-on: ubuntu-latest
        timeout-minutes: 20
        outputs:
            backend_url: ${{ steps.wait.outputs.backend_url }}
        steps:
            - name: Wait for backend preview deploy
              id: wait
              env:
                  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  SERVICE_DISPLAY_NAME: Terse
                  TIMEOUT_SECONDS: "900" # 15 min; job-level safety net is 20 min
                  POLL_SECONDS: "15"
                  # A deploy for an older commit may still be the newest one Render knows about when
                  # this job starts. Ignore terminal statuses on those until the grace period is up,
                  # so a previous run's failure can't fail this run before our deploy even exists.
                  STALE_GRACE_SECONDS: "180"
              run: |
                  set -euo pipefail

                  if [[ -z "${RENDER_API_KEY:-}" ]]; then
                      echo "::error::RENDER_API_KEY secret is not set"
                      exit 1
                  fi

                  preview_name="${SERVICE_DISPLAY_NAME} PR #${PR_NUMBER}"
                  start=$(date +%s)
                  echo "Waiting for Render preview service '${preview_name}' to deploy ${HEAD_SHA} and reach status=live..."

                  while :; do
                      elapsed=$(( $(date +%s) - start ))
                      if (( elapsed > TIMEOUT_SECONDS )); then
                          echo "::error::Timed out after ${elapsed}s waiting for '${preview_name}' to deploy ${HEAD_SHA}"
                          exit 1
                      fi

                      # Find the preview service by name.
                      services=$(curl -sS -G \
                          --data-urlencode "name=${preview_name}" \
                          --data-urlencode "limit=1" \
                          -H "Authorization: Bearer ${RENDER_API_KEY}" \
                          -H "Accept: application/json" \
                          "https://api.render.com/v1/services")

                      service_id=$(echo "$services" | jq -r '.[0].service.id // empty')
                      service_url=$(echo "$services" | jq -r '.[0].service.serviceDetails.url // empty')

                      if [[ -z "$service_id" ]]; then
                          echo "[${elapsed}s] Preview service not found yet, retrying in ${POLL_SECONDS}s..."
                          sleep "$POLL_SECONDS"
                          continue
                      fi

                      deploys=$(curl -sS -G \
                          --data-urlencode "limit=20" \
                          -H "Authorization: Bearer ${RENDER_API_KEY}" \
                          -H "Accept: application/json" \
                          "https://api.render.com/v1/services/${service_id}/deploys")

                      # Prefer the deploy built from this run's commit; only fall back to the newest
                      # deploy once the grace period has passed, and never let a stale failure decide.
                      deploy=$(echo "$deploys" | jq -c --arg sha "$HEAD_SHA" 'map(.deploy) | map(select(.commit.id == $sha)) | .[0] // empty')
                      matched_sha=true
                      if [[ -z "$deploy" ]]; then
                          matched_sha=false
                          deploy=$(echo "$deploys" | jq -c 'map(.deploy) | .[0] // empty')
                      fi

                      status=$(echo "${deploy:-}" | jq -r '.status // empty')
                      deploy_id=$(echo "${deploy:-}" | jq -r '.id // empty')
                      deploy_sha=$(echo "${deploy:-}" | jq -r '.commit.id // "unknown"')

                      if [[ "$matched_sha" == "false" ]] && (( elapsed < STALE_GRACE_SECONDS )); then
                          echo "[${elapsed}s] No deploy for ${HEAD_SHA} yet (newest is ${deploy_sha:0:8}, status=${status:-unknown}), sleeping ${POLL_SECONDS}s..."
                          sleep "$POLL_SECONDS"
                          continue
                      fi

                      case "$status" in
                          live)
                              echo "Preview is live at ${service_url} (deploy ${deploy_id}, commit ${deploy_sha:0:8})"
                              echo "backend_url=${service_url}" >> "$GITHUB_OUTPUT"
                              exit 0
                              ;;
                          build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                              echo "::error::Preview deploy ${deploy_id} (commit ${deploy_sha:0:8}) ended with status=${status}. Logs: https://dashboard.render.com/web/${service_id}/deploys/${deploy_id}"
                              exit 1
                              ;;
                          *)
                              echo "[${elapsed}s] deploy ${deploy_id} (commit ${deploy_sha:0:8}) status=${status:-unknown}, sleeping ${POLL_SECONDS}s..."
                              sleep "$POLL_SECONDS"
                              ;;
                      esac
                  done

    e2e:
        name: End-to-End Tests
        needs: [wait-for-render-preview]
        # Run when the wait job succeeded OR was skipped (push to main).
        # Skip on fork PRs — TERSE_API_KEY isn't available, and a maintainer can re-run on a branch.
        if: >
            always() &&
            needs.wait-for-render-preview.result != 'failure' &&
            needs.wait-for-render-preview.result != 'cancelled' &&
            github.event.pull_request.head.repo.fork != true
        runs-on: blacksmith-4vcpu-ubuntu-2404
        env:
            TERSE_BACKEND_URL: ${{ needs.wait-for-render-preview.outputs.backend_url || 'https://terse.onrender.com' }}
            TERSE_FRONTEND_URL: https://terse-frontend.onrender.com
            TERSE_API_KEY: ${{ secrets.TERSE_API_KEY }}

        steps:
            # ── Setup ─────────────────────────────────────────────────────────────

            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install pnpm
              uses: pnpm/action-setup@e9540b3eafaf84907c087a645d3258bfaa861427 # v3.0.0
              with:
                  version: 9

            # ── Build CLI + SDK from PR source ────────────────────────────────────

            - name: Install dependencies
              run: pnpm install

            - name: Generate Prisma client
              working-directory: backend
              run: pnpm run db:generate

            - name: Build all packages
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
              run: pnpm run build

            - name: Install CLI globally from PR source
              run: npm install -g ./packages/terse-cli

            - name: Verify CLI is available
              run: terse --version

            - name: Place job file for TS fixture
              run: cp packages/ci-test-fixture/src/terse.jobs.src packages/ci-test-fixture/src/terse.jobs.ts

            - name: "[generate] Run codegen on CI test fixture"
              working-directory: packages/ci-test-fixture
              run: terse generate

            - name: "[assert] Verify project builds"
              working-directory: packages/ci-test-fixture
              run: pnpm typecheck

            - name: "[setup] Create ephemeral Terse project for the fixture"
              id: create_project
              working-directory: packages/ci-test-fixture
              run: |
                  set -euo pipefail
                  response=$(curl -sS -X POST "${TERSE_BACKEND_URL}/sdk/projects" \
                      -H "Authorization: Bearer ${TERSE_API_KEY}" \
                      -H "Content-Type: application/json" \
                      -d "{\"name\":\"ci-test-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"}")
                  project_id=$(echo "$response" | jq -r '.projectId // empty')
                  if [[ -z "$project_id" ]]; then
                      echo "::error::Failed to create Terse project: $response"
                      exit 1
                  fi
                  echo "project_id=${project_id}" >> "$GITHUB_OUTPUT"
                  printf '{\n  "projectId": "%s",\n  "name": "ci-test-fixture"\n}\n' "$project_id" > terse.config.json
                  echo "Created ephemeral project ${project_id}"

            - name: "[run] Execute CI test fixture"
              working-directory: packages/ci-test-fixture
              env:
                  TERSE_CLI_ENABLE_RUN: "1"
              run: terse run "Tell me a joke" --event-file ./src/sample-webhook-event.json

            # ── Cleanup ───────────────────────────────────────────────────────────

            - name: "[cleanup] Delete ephemeral Terse project"
              if: always() && steps.create_project.outputs.project_id != ''
              run: |
                  curl -sS -X DELETE "${TERSE_BACKEND_URL}/projects/${{ steps.create_project.outputs.project_id }}" \
                      -H "Authorization: Bearer ${TERSE_API_KEY}" \
                      -o /dev/null -w "Deleted ephemeral project (HTTP %{http_code})\n" || true

            - name: Upload logs on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-failure-logs
                  path: |
                      packages/ci-test-fixture/**/*.log
                  retention-days: 7
