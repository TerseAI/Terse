name: Docker Build Check
on:
    pull_request:
        paths:
            - "Dockerfile"
            - "backend/**"
            - "frontend/**"
            - "terse-types/**"
            - "packages/terse-sdk/**"
            - "pnpm-lock.yaml"
            - "docker/**"
            - ".github/workflows/docker-build.yml"
            - ".github/workflows/durable-objects-cloud-run.yml"
permissions:
    contents: read
jobs:
    build:
        name: Build image (no push)
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 45
        services:
            registry:
                image: registry:2
                ports:
                    - 5000:5000
        steps:
            - uses: actions/checkout@v4
            - name: Checkout Durable Objects
              uses: actions/checkout@v4
              with:
                  repository: TerseAI/durable-objects
                  path: .durable-objects
            - uses: docker/setup-buildx-action@v3
              with:
                  driver-opts: network=host
            - name: Terse application image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  cache-from: type=gha
                  # Fork PRs get a read-only cache token; a denied export must not
                  # fail the build check.
                  cache-to: type=gha,mode=max,ignore-error=true

            - name: Durable Objects Cloud Run image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/durable-objects-cloud-run.Dockerfile
                  platforms: linux/amd64
                  build-contexts: |
                      durable_objects_source=.durable-objects
                  cache-from: type=gha,scope=durable-objects-cloud-run
                  cache-to: type=gha,mode=max,scope=durable-objects-cloud-run,ignore-error=true

            # This release's packages do not exist yet, so the Dockerfile is proven
            # against whatever is currently published.
            - name: Resolve the published CLI version
              id: published
              run: |
                  version=$(npm view terse-cli version)
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  # Falls back to the umbrella's pin for CLI releases that predate the @workflow/core
                  # swap; both packages ship under the same version string.
                  deps=$(npm view "terse-cli@${version}" dependencies --json)
                  echo "workflow_core=$(node -p "const d = JSON.parse(process.argv[1]); d['@workflow/core'] ?? d.workflow" "$deps")" >> "$GITHUB_OUTPUT"

            # Pushed to the job-local registry so the leaf images can FROM it. BuildKit reaches it
            # over the host network and allows plain HTTP because the host is localhost.
            - name: Sandbox base image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/sandbox-node-base.Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: localhost:5000/terse-sandbox-base:pr
                  build-args: |
                      TERSE_VERSION=${{ steps.published.outputs.version }}
                  build-contexts: |
                      durable_objects_source=.durable-objects
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true

            - name: Sandbox image (pnpm)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/sandbox-node-pnpm.Dockerfile
                  platforms: linux/amd64
                  build-args: |
                      BASE_IMAGE=localhost:5000/terse-sandbox-base:pr
                      TERSE_VERSION=${{ steps.published.outputs.version }}
                      DURABLE_OBJECTS_DEPENDENCY_SPEC=file:/opt/terse-sdk-cache/packages/terse-durable-objects.tgz
                      WORKFLOW_CORE_VERSION=${{ steps.published.outputs.workflow_core }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true

            - name: Sandbox image (npm)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/sandbox-node-npm.Dockerfile
                  platforms: linux/amd64
                  build-args: |
                      BASE_IMAGE=localhost:5000/terse-sandbox-base:pr
                      TERSE_VERSION=${{ steps.published.outputs.version }}
                      DURABLE_OBJECTS_DEPENDENCY_SPEC=file:/opt/terse-sdk-cache/packages/terse-durable-objects.tgz
                      WORKFLOW_CORE_VERSION=${{ steps.published.outputs.workflow_core }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true
