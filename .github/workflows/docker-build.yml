name: Docker Build Check
on:
    pull_request:
        paths:
            - "Dockerfile"
            - "backend/**"
            - "frontend/**"
            - "terse-types/**"
            - "packages/terse-sdk/**"
            - "pnpm-lock.yaml"
            - "docker/**"
            - ".github/workflows/docker-build.yml"
permissions:
    contents: read
jobs:
    build:
        name: Build image (no push)
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Control plane image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  cache-from: type=gha
                  # Fork PRs get a read-only cache token; a denied export must not
                  # fail the build check.
                  cache-to: type=gha,mode=max,ignore-error=true

            # This release's packages do not exist yet, so the Dockerfile is proven
            # against whatever is currently published.
            - name: Resolve the published CLI version
              id: published
              run: echo "version=$(npm view terse-cli version)" >> "$GITHUB_OUTPUT"

            - name: Sandbox image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/sandbox-node.Dockerfile
                  platforms: linux/amd64
                  build-args: |
                      TERSE_VERSION=${{ steps.published.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true
